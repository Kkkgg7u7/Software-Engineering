# 生产/答辩演示 profile：MySQL 8。
# 建库脚本见 database/schema.sql，连接信息全部走环境变量。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:werewolf}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:werewolf}
    password: ${MYSQL_PASSWORD:werewolf123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  sql:
    init:
      # MySQL 环境由 database/schema.sql 手工初始化，应用不自动建表
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
