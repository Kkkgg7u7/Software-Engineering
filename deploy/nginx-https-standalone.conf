# =====================================================================
# 前端容器内的 Nginx 站点配置
#   * 构建镜像时被复制到 /etc/nginx/conf.d/default.conf
#   * 该文件位于 nginx 的 http 上下文（conf.d/*.conf 由主配置 include），
#     所以这里可以使用 map 指令
#
# 同源部署策略（推荐，前后端不需要 CORS）：
#   http://<host>/            -> 前端静态资源（Vue3 SPA，history 路由）
#   http://<host>/api/...     -> http://127.0.0.1:8080/api/...
#   ws://<host>/ws            -> http://127.0.0.1:8080/ws   （STOMP over WebSocket）
#
# backend 是 docker-compose 网络里的服务名；若改成非容器部署，
# 把下面所有 http://127.0.0.1:8080 换成真实后端地址即可。
# =====================================================================

# WebSocket 升级头：原生 WS 请求带 Upgrade 头时用 "upgrade"，
# 普通 HTTP（含 SockJS 的 xhr / info 轮询）用 "close"，避免误升连接。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jiujiu.example.com;
    return 301 https://jiujiu.example.com$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    ssl_certificate /etc/jiujiu/tls/fullchain.pem;
    ssl_certificate_key /etc/jiujiu/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name jiujiu.example.com;

    root  /var/www/jiujiu;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    # 隐藏版本号
    server_tokens off;

    # ---------------------------------------------------------- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------- 安全响应头 -------
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options        SAMEORIGIN         always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # ------------------------------------------------- 容器健康检查 -----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------- 后端 REST API ----
    # 注意：location 与 proxy_pass 的路径必须一致，保证 /api/xxx 原样转发
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------- WebSocket / STOMP -----
    # 前缀匹配同时覆盖：
    #   /ws                                 原生 WebSocket 握手
    #   /ws/info  /ws/{server}/{session}/...  SockJS 兜底传输
    location /ws {
        proxy_pass         http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 长连接：一局游戏可能持续几十分钟，读超时必须放大
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # --------------------------------------------- 静态资源缓存策略 ----
    # 构建产物（vite 带 hash 的 js/css）与 public/assets 下的 SVG 素材：强缓存
    location /assets/ {
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files  $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|ico|svg|mp4)$ {
        access_log off;
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        try_files  $uri =404;
    }

    # 入口 HTML 绝不能缓存，否则前端发版后用户仍加载旧 hash 资源
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # ------------------------------------------- SPA history 路由 ------
    # /lobby、/room/XXXXXX、/game/XXXXXX 等前端路由都要回落到 index.html
    # （注意：/assets/ 与静态后缀 location 用的是 try_files $uri =404，
    #   不会回落到 index.html，避免前端把 HTML 当成 JS 解析）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
